<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Contactos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div th:if="${msgExito != null}" class="alert alert-success alert-dismissible fade show shadow" role="alert"
     style="position: fixed; top: 20px; right: 20px; z-index: 9999;">
    <strong th:text="${msgExito}"></strong>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div class="container mt-5">
    <h1>Lista de Contactos</h1>
    <a class="btn btn-success" th:href="@{/nuevo}">Añadir Contacto</a>
    <br>
<table class="table table-bordered border-primary">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Celular</th>
        <th>Email</th>
        <th>Fecha Nacimiento</th>
        <th>Fecha de Registro</th>
        <th>Editar: </th>
        <th>Eliminar: </th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="contacto : ${contactos}">
        <td th:text="${contacto.id}"></td>
        <td th:text="${contacto.nombre}"></td>
        <td th:text="${contacto.celular}"></td>
        <td th:text="${contacto.email}"></td>
        <td th:text="${#temporals.format(contacto.fechaNacimiento, 'dd/MM/YYYY')}"></td>
        <td th:text="${#temporals.format(contacto.fechaRegistro, 'dd/MM/YYYY hh:mm a')}"></td>
        <td>
            <a class="btn btn-warning" th:href="@{/{id}/editar(id=${contacto.id})}">Editar</a>
        </td>
        <th>
            <a href="#" onclick="eliminarContacto(this)" class="btn btn-danger">Eliminar</a>
            <form th:action="@{/{id}/eliminar(id=${contacto.id})}" method="post"></form>
        </th>
    </tr>
    </tbody>
</table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
    function eliminarContacto(elemento){
        var ok = confirm('¿Estas seguro de eliminar al contacto?' );
        if(ok){
        elemento.nextElementSibling.submit();
        }
    }
</script>
</body>
</html>
